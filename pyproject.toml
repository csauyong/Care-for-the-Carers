[project]
name = "care-for-the-carers"
version = "2.0.0"
description = "A Telegram companion for stressed family caregivers, with an evaluation harness."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.1",
    "pyTelegramBotAPI>=4.20",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Any OpenAI-compatible endpoint: OpenAI itself, Ollama, vLLM, LM Studio, ...
openai = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
carebot = "carebot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
