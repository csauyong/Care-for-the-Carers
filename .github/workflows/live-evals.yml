name: Live evals

# Runs the bot against real models. Costs API credits, so it is manual only.
# Needs the ANTHROPIC_API_KEY repository secret. Reports are uploaded as an
# artifact even when cases fail.
on:
  workflow_dispatch:
    inputs:
      trials:
        description: Trials per case
        default: "3"
      models:
        description: Space-separated models to benchmark
        default: "claude-opus-5-5 claude-sonnet-5-5 claude-haiku-5-5"
      agents:
        description: Agent modes to benchmark (policy, tools)
        default: "policy tools"

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TRIALS: ${{ inputs.trials }}
      MODELS: ${{ inputs.models }}
      AGENTS: ${{ inputs.agents }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install .
      - name: Detectors (keyword vs LLM)
        run: |
          carebot --detector keyword eval detector --min-crisis-recall 0
          carebot --detector llm eval detector --min-crisis-recall 0
      - name: Retrieval (BM25 vs LLM recommender, held-out split)
        run: |
          carebot eval retrieval --retriever bm25
          carebot eval retrieval --retriever llm
      - name: Benchmark scenarios across models and agent modes, with the LLM judge
        run: carebot eval benchmark --suite scenarios --judge --trials "$TRIALS" --models $MODELS --agents $AGENTS
      - name: Simulated caregivers and adaptive red-teaming (default model)
        run: carebot eval benchmark --suite personas --trials "$TRIALS" --agents $AGENTS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval-results/
